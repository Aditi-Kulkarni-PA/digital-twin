function pick(id){sel=id;
document.querySelectorAll('.rcard').forEach(function(el,i){var rr=R[i];var on=rr.id===id;
el.style.background=rr.color+(on?'2e':'17');el.style.borderColor=on?rr.color:rr.color+'66';el.style.borderWidth=on?'2px':'1.5px';});
document.getElementById('detailArea').outerHTML=detailHtml();
}
function tp(el){el.parentNode.classList.toggle('open');}
function tskl(){document.getElementById('sklwrap').classList.toggle('col');}
